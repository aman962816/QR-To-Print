<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | QR to Print</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="smallhero"><a href="/" class="back">← QR to Print</a><h1>एडमिन पैनल</h1><p>फाइल देखें, डाउनलोड करें और प्रिंट निकालें।</p></header>
<main class="wrap"><section id="loginCard" class="card narrow"><label>Admin Password <input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड डालें"></label><button id="login" class="btn">लॉगिन</button><p id="loginMsg" role="status"></p></section>
<section id="dashboard" hidden><div class="bar"><h2>प्रिंट ऑर्डर</h2><button id="refresh" class="btn secondary">Refresh</button></div><div id="jobs" class="jobs"></div></section></main>
<script>
let password='';const $=id=>document.getElementById(id);
$('login').onclick=async()=>{password=$('password').value;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(!r.ok)throw new Error(d.error);$('loginCard').hidden=true;$('dashboard').hidden=false;loadJobs();}catch(e){$('loginMsg').className='error';$('loginMsg').textContent=e.message;}};
$('refresh').onclick=loadJobs;
async function loadJobs(){const box=$('jobs');box.innerHTML='<p>लोड हो रहा है…</p>';try{const r=await fetch('/api/admin/jobs',{headers:{'x-admin-password':password}});const data=await r.json();if(!r.ok)throw new Error(data.error);if(!data.length){box.innerHTML='<div class="card">अभी कोई फाइल नहीं आई है।</div>';return;}box.innerHTML='';data.forEach(j=>{const card=document.createElement('article');card.className='card job';const files=j.files.map(f=>`<li><a href="${f.url}" target="_blank" rel="noopener">${escapeHtml(f.originalName)}</a> (${(f.size/1024/1024).toFixed(2)} MB)</li>`).join('');card.innerHTML=`<div class="bar"><h3>${escapeHtml(j.id)}</h3><span class="status">${escapeHtml(j.status)}</span></div><p><b>नाम:</b> ${escapeHtml(j.name)} &nbsp; <b>मोबाइल:</b> ${escapeHtml(j.phone||'—')}</p><p><b>कॉपी:</b> ${j.copies} • <b>प्रकार:</b> ${j.color==='color'?'कलर':'ब्लैक एंड व्हाइट'} • <b>पेपर:</b> ${j.paper}</p><ul>${files}</ul><label>स्टेटस<select class="statusSelect"><option ${j.status==='Pending'?'selected':''}>Pending</option><option ${j.status==='Printing'?'selected':''}>Printing</option><option ${j.status==='Completed'?'selected':''}>Completed</option></select></label><button class="btn printBtn">प्रिंट / Print</button> <button class="btn secondary saveBtn">स्टेटस सेव करें</button><p class="muted">${new Date(j.createdAt).toLocaleString()}</p>`;card.querySelector('.printBtn').onclick=()=>{const first=j.files[0];if(first)window.open(first.url,'_blank','noopener');};card.querySelector('.saveBtn').onclick=async()=>{const status=card.querySelector('.statusSelect').value;const resp=await fetch('/api/admin/jobs/'+encodeURIComponent(j.id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({status})});if(resp.ok)loadJobs();else alert('स्टेटस सेव नहीं हुआ।');};box.appendChild(card);});}catch(e){box.innerHTML='<div class="card error">'+escapeHtml(e.message)+'</div>';}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
